<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="speedoGrad" x1="10" y1="36" x2="54" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="20" y1="40" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#1e293b" stroke-width="2"/>

  <!-- Speedometer Arc -->
  <path d="M 14 42 A 22 22 0 1 1 50 42" stroke="url(#speedoGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Speed Needle (high revs) -->
  <line x1="32" y1="36" x2="45" y2="21" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <circle cx="32" cy="36" r="3.5" fill="#f8fafc"/>

  <!-- Sleek Cyber Racer Car Silhouette -->
  <path d="M 18 51 C 21 47, 26 44, 32 44 C 38 44, 43 47, 46 51 L 44 54 L 20 54 Z" fill="url(#carGrad)"/>
  <circle cx="23" cy="53" r="2" fill="#0f172a"/>
  <circle cx="41" cy="53" r="2" fill="#0f172a"/>
  <path d="M 27 46 L 37 46 L 35 48 L 29 48 Z" fill="#ffffff" opacity="0.85"/>
</svg>
